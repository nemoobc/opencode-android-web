name: web-test (emulator browser)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['docs/**', 'webtest.js', '.github/workflows/web-test.yml']

jobs:
  webtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: install playwright + chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i -D playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: tunggu Pages deploy (anti versi basi)
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://nemoobc.github.io/opencode-android-web/ || echo 000)
            [ "$CODE" = "200" ] && echo "pages OK" && break
            sleep 10
          done
          sleep 90
      - name: jalanin webtest (Pages REAL)
        run: node webtest.js https://nemoobc.github.io/opencode-android-web/ shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-shots
          path: |
            shots/*.png
            http.log
